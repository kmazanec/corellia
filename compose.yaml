# ──────────────────────────────────────────────────────────────────────────────
# Corellia — daemon + Postgres (F-66)
#
# `docker compose up` brings up the front-door daemon and its Postgres
# substrate. The daemon runs via tsx (the image has no compiled dist/ — see
# Dockerfile). Schema migration fires on cold boot: daemon.ts calls
# store.ensureSchema() when DATABASE_URL is set, which runs the Pg store's
# CREATE TABLE IF NOT EXISTS path (src/substrate/pg-event-store.ts).
#
# SECRETS (ADR-012): every secret arrives via env_file ONLY. There are NO
# literal secret values in this file or in the image. Copy .env.example to
# .env and populate it before `docker compose up`.
#
# The healthcheck hits GET /status with the bearer token and expects HTTP 200.
# The bearer token is read from the daemon container's own FRONT_DOOR_TOKEN
# env (sourced from .env via env_file) — never hard-coded here.
#
# THE FLEET (profile `fleet`, ADR-051): a control plane (the operator console
# and its API) plus N single-job queue workers on the same Postgres.
#
#   docker compose --profile fleet up -d postgres control-plane worker
#   open http://localhost:8090          (CONSOLE_HOST_PORT overrides)
#   docker compose --profile fleet up -d --scale worker=4 worker
#
# `docker compose --profile fleet up` with no service names also starts the
# single-process daemon beside the fleet; both are safe on one database.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # POSTGRES_PASSWORD is supplied via .env (env_file) — no literal here.
    env_file:
      - .env
    volumes:
      - corellia-pgdata:/var/lib/postgresql
    healthcheck:
      # pg_isready gates the daemon's depends_on so migration never races an
      # unready database on cold boot.
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-postgres}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  daemon:
    build:
      context: .
      target: runtime
    # Named so the fleet's workers reuse this exact image (one build, two roles).
    image: corellia:local
    restart: unless-stopped
    # ALL config — including FRONT_DOOR_TOKEN, DATABASE_URL, GITHUB_TOKEN, and
    # the envelope vars — is supplied via .env (env_file). No `environment:`
    # secret literals (ADR-012).
    env_file:
      - .env
    environment:
      # The target repo is mounted at /workspace (below); the daemon builds there.
      CORELLIA_REPO_ROOT: /workspace
      # Trace backend, opt-in via `--profile observe`. The default is EMPTY, so a
      # plain `docker compose up` (no profile) leaves the OTLP sink off and
      # default deploys unchanged (config.ts: an empty endpoint builds no sink).
      # With the profile, set the var to the bundled Jaeger's OTLP receiver:
      #   CORELLIA_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile observe up
      # then browse the run at http://localhost:16686. A collector URL is not a
      # secret (ADR-012 governs secret literals only), so it may live here.
      CORELLIA_OTLP_ENDPOINT: '${CORELLIA_OTLP_ENDPOINT:-}'
    ports:
      # Publish the front door. FRONT_DOOR_PORT defaults to 8080 in the daemon;
      # the host-side port is operator-overridable via HOST_PORT in .env.
      - '${HOST_PORT:-8080}:8080'
    volumes:
      # Mount the target repo the factory operates on. TARGET_REPO_PATH is set
      # in .env; the container sees it at /workspace. v1 constraint: the target
      # repo must be a Node/TypeScript project (the image ships Node only).
      - '${TARGET_REPO_PATH:-./}:/workspace'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # GET /status with the bearer token must return HTTP 200. We use wget
      # (present in node:slim via busybox? no — use node itself) to avoid an
      # extra dependency: a tiny node one-liner that exits non-zero on != 200.
      # NOTE: $$ escapes compose interpolation so the literal ${...} reaches
      # node's template strings. The token is read from the container env
      # (FRONT_DOOR_TOKEN, via env_file) — never written here.
      test:
        - CMD
        - node
        - '-e'
        - >
          const t=process.env.FRONT_DOOR_TOKEN;
          const p=process.env.FRONT_DOOR_PORT||8080;
          fetch(`http://127.0.0.1:$${p}/status`,{headers:{authorization:`Bearer $${t}`}})
            .then(r=>process.exit(r.status===200?0:1))
            .catch(()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── The fleet (profile: fleet, ADR-051) ─────────────────────────────────────
  # The control plane: the operator console's API, live streams, and SPA. It
  # reads the shared event log and writes only job rows; it runs no model and
  # needs no target repo. FRONT_DOOR_TOKEN (from .env) is the operator token.
  control-plane:
    profiles: ['fleet']
    build:
      context: .
      dockerfile: console/Dockerfile
    image: corellia-console:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONSOLE_PORT: '8090'
    ports:
      - '${CONSOLE_HOST_PORT:-8090}:8090'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /api/health is the one unauthenticated route.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8090/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Queue workers: the factory image, entered at the worker instead of the
  # daemon. Each replica claims one job at a time from the shared queue and runs
  # all of it; scale with CORELLIA_WORKERS or `--scale worker=N`. Every replica
  # mounts the same target repo and keeps its trees in their own worktrees.
  # CORELLIA_WORKER_REPOS (in .env) names the repo keys they serve; without it a
  # worker derives one from the mounted repo's origin remote.
  worker:
    profiles: ['fleet']
    build:
      context: .
      target: runtime
    image: corellia:local
    entrypoint: ['node', 'node_modules/.bin/tsx', 'src/daemon/worker.ts']
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CORELLIA_REPO_ROOT: /workspace
      CORELLIA_OTLP_ENDPOINT: '${CORELLIA_OTLP_ENDPOINT:-}'
    volumes:
      - '${TARGET_REPO_PATH:-./}:/workspace'
    deploy:
      replicas: ${CORELLIA_WORKERS:-2}
    # SIGTERM: the worker preserves its tree and records the job interrupted.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ── Optional trace backend (profile: observe) ──────────────────────────────
  # Jaeger all-in-one — the cheapest graphical view of a run. It is in the
  # `observe` profile, so it starts ONLY with `--profile observe` and default
  # `docker compose up` stays two containers (daemon + postgres). Point the
  # daemon at it with CORELLIA_OTLP_ENDPOINT=http://jaeger:4318 (see the daemon
  # service). Traces land as a waterfall of every goal, attempt, and judge
  # verdict at http://localhost:16686. All-in-one is in-memory only — a fresh
  # start drops prior traces; it is a live-watch surface, not durable storage.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ['observe']
    restart: unless-stopped
    environment:
      # Enable the OTLP receiver so the daemon's dependency-free OTLP/HTTP sink
      # can post straight to Jaeger with no separate collector.
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI — open this to watch a run.
      - '4318:4318'   # OTLP/HTTP receiver (the daemon posts here in-network).

volumes:
  corellia-pgdata:
